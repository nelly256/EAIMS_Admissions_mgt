<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EAIMS Admissions - Admin Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}?v=23" />
</head>
<body class="login-body">
    <div class="app-shell">
        <header class="app-header">
            <div>
                <h1>EAIMS Admissions</h1>
                <p>Admissions management interface for programmes, intakes, students, and admission letters.</p>
            </div>
        </header>

        <main class="main-content">
            <div class="login-page">
                <div class="login-card">
                    <form id="login-form" class="login-form" autocomplete="off">
                        <div class="login-controls">
                            <label>
                                Username
                                <input type="text" name="username" required placeholder="Enter username" />
                            </label>
                            <label>
                                Password
                                <input type="password" name="password" required placeholder="Enter password" />
                            </label>
                            <button type="submit" class="primary-button login-button">Sign In</button>
                            <button type="button" id="forgot-password-button" class="forgot-password-button">Forget Password</button>
                    </div>
                </form>
            </div>
            </div>
        </main>
    </div>

    <script src="{% static 'app.js' %}?v=23" defer></script>
</body>
</html>
